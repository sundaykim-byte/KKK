<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>인터랙티브 아트 캔버스</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* 스크롤 방지 */
        background-color: #FDFBF7; /* 눈이 편안한 따뜻한 도화지 색상 */
        touch-action: none; /* 모바일/태블릿 화면 확대 방지 */
        user-select: none;
        font-family: '맑은 고딕', sans-serif
        width: 100vw;
        height: 100vh;
    }

    #instruction {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #BDBDBD;
        font-weight: bold;
        pointer-events: none;
        transition: opacity 0.5s ease;
        text-align: center;
        z-index: 10;
    }

    /* 컨트롤 버튼 영역 */
    .controls {
        position: absolute;
        bottom: 30px;
        right: 30px;
        display: flex;
        gap: 15px;
        z-index: 100;
    }

    button {
        padding: 15px 25px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        background-color: #ffffff;
        color: #4A4A4A;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: transform 0.1s, box-shadow 0.1s;
    }

    button:active {
        transform: scale(0.95);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 물감 자국 애니메이션 컨테이너 */
    .splash-container {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: none; /* 물감 위를 다시 클릭할 수 있도록 방해 금지 */
    }

    /* 영구적으로 남는 물감 자국 */
    .paint-blob {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border-radius: 50%;
        mix-blend-mode: multiply; /* 수채화처럼 겹치는 효과 */
        transform: scale(0);
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 클릭 시 퍼져나가는 파동 (시각적 피드백 강조) */
    .ripple {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border-radius: 50%;
        box-sizing: border-box;
        transform: scale(0.5);
        animation: rippleOut 1s ease-out forwards;
    }

    @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 0.85; }
    }

    @keyframes rippleOut {
        0% { transform: scale(0.8); opacity: 0.8; border-width: 10px; }
        100% { transform: scale(3); opacity: 0; border-width: 0px; }
    }
</style>
</head>
<body>

    <div id="instruction">화면 아무 곳이나<br>터치하거나 클릭해 보세요!</div>

    <div class="controls">
        <button id="clearBtn">새 도화지</button>
    </div>

<script>
    // 1. 오디오 컨텍스트 설정 (시각적 과부하가 없는 실로폰 느낌의 맑은 소리)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // 자폐성 장애 학생의 감각 과부하를 막기 위한 파스텔톤 컬러 팔레트
    const colors = [
        '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA', 
        '#FFCBF2', '#F3B0C3', '#C6D8FF', '#FDFD96', '#FF9AA2'
    ];

    // 아름다운 화음을 유지하기 위한 펜타토닉 스케일(5음계) 주파수
    const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25]; 

    let isFirstAction = true;

    // 소리 재생 함수 (외부 파일 없이 코드로 소리 생성)
    function playSound() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // 랜덤 음계 선택
        const freq = notes[Math.floor(Math.random() * notes.length)];
        osc.type = 'sine'; // 부드러운 사인파
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // 소리 크기 조절 (자극적이지 않게)
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); // Attack
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5); // Release

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 1.5);
    }

    // 물감 번짐 생성 함수
    function createSplash(x, y) {
        if (isFirstAction) {
            document.getElementById('instruction').style.opacity = '0';
            isFirstAction = false;
        }

        const size = Math.random() * 80 + 50; // 50px ~ 130px 크기 랜덤
        const color = colors[Math.floor(Math.random() * colors.length)];

        // 전체 컨테이너
        const container = document.createElement('div');
        container.className = 'splash-container';
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        container.style.width = size + 'px';
        container.style.height = size + 'px';

        // 영구적인 물감 자국
        const blob = document.createElement('div');
        blob.className = 'paint-blob';
        blob.style.backgroundColor = color;

        // 시각적 피드백용 파동
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.borderColor = color;

        container.appendChild(blob);
        container.appendChild(ripple);
        document.body.appendChild(container);

        // 파동 요소는 애니메이션이 끝나면 메모리 확보를 위해 삭제 (자국은 남음)
        setTimeout(() => {
            ripple.remove();
        }, 1000);

        playSound();
    }

    // 이벤트 리스너: 클릭 및 터치 모두 지원 (모바일/태블릿 최적화)
    document.body.addEventListener('mousedown', function(e) {
        if (e.target.tagName === 'BUTTON') return; // 버튼 클릭 시 물감 방지
        createSplash(e.clientX, e.clientY);
    });

    document.body.addEventListener('touchstart', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        // 멀티 터치 지원 (여러 손가락으로 동시에 찍어도 작동)
        for(let i = 0; i < e.changedTouches.length; i++) {
            createSplash(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
    }, {passive: false});

    // 화면 지우기 버튼
    document.getElementById('clearBtn').addEventListener('click', function() {
        const splashes = document.querySelectorAll('.splash-container');
        splashes.forEach(splash => splash.remove());
        
        isFirstAction = true;
        document.getElementById('instruction').style.opacity = '1';
    });
</script>
</body>
</html>
